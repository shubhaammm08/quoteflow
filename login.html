<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Login - QuoteFlow AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tailwind-theme.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 font-body-md text-gray-900 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-sm border border-gray-200 overflow-hidden relative">
        <div class="absolute top-0 right-0 w-32 h-32 bg-indigo-50 rounded-bl-full -mr-16 -mt-16 transition-transform duration-500 hover:scale-110"></div>
        
        <div class="p-8 relative z-10">
            <div class="flex items-center gap-3 mb-8">
                <div class="w-10 h-10 rounded-full shadow-sm flex items-center justify-center bg-white border border-gray-200">
                    <img alt="Logo" class="h-6 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBz88-rWElaCZjsu-m4MYaSbNIzgb7I4UdKXGY-SrIoPFYn-sbIrIN2wEW29eZYPe-4X3mKwae_fSL_Xezd8mzvh2MKQiGIe8kkjo0yIZCFWe71SBmJtV2wqklTJbw7Rw-cjhf3oP58OXckVW3gQsuw0Q7O6t2CTlKIPuhPbd7hJCpYKhKWwpYccmmE0Aa4O68pERbuUGaS37Gd8BgQjDqab4TGQVoc1iVp9E0wD4TWnL8TakhjkUh_F9AR-wJkKm2w1A">
                </div>
                <span class="text-xl font-bold text-indigo-600">QuoteFlow</span>
            </div>

            <h1 class="text-2xl font-bold text-gray-900 mb-2">Welcome Back</h1>
            <p class="text-sm text-gray-600 mb-8">Please sign in to access your quotations.</p>

            <form id="login-form" class="flex flex-col gap-5">
                <div id="error-message" class="hidden text-sm text-red-600 bg-red-50 p-3 rounded-xl border border-red-100"></div>
                
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-semibold text-gray-600 uppercase tracking-wider pl-1">Email Address</label>
                    <div class="relative flex items-center group">
                        <input id="email" class="w-full bg-gray-50 text-gray-900 text-sm rounded-xl py-3 pl-4 pr-10 border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:bg-white transition-all shadow-inner" type="email" required>
                        <span class="material-symbols-outlined text-gray-400 absolute right-3 text-[18px]">mail</span>
                    </div>
                </div>

                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-semibold text-gray-600 uppercase tracking-wider pl-1">Password</label>
                    <div class="relative flex items-center group">
                        <input id="password" class="w-full bg-gray-50 text-gray-900 text-sm rounded-xl py-3 pl-4 pr-10 border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:bg-white transition-all shadow-inner" type="password" required>
                        <span class="material-symbols-outlined text-gray-400 absolute right-3 text-[18px]">lock</span>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="mt-2 w-full flex items-center justify-center gap-2 bg-indigo-600 text-white font-bold py-3 px-6 rounded-xl hover:bg-indigo-700 active:scale-95 transition-all shadow-md hover:shadow-lg">
                    <span>Sign In</span>
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-gray-600">
                Don't have an account? <button id="toggle-mode" class="text-indigo-600 font-bold hover:underline">Sign Up</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth } from './firebase-config.js';
        import { signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        
        // Also import the auth listener so it handles redirects if already logged in
        import './auth.js';

        let isSignUp = false;
        const form = document.getElementById('login-form');
        const submitBtn = document.getElementById('submit-btn');
        const toggleBtn = document.getElementById('toggle-mode');
        const title = document.querySelector('h1');
        const subtitle = document.querySelector('p');
        const errorMsg = document.getElementById('error-message');

        toggleBtn.addEventListener('click', () => {
            isSignUp = !isSignUp;
            if (isSignUp) {
                title.textContent = "Create Account";
                subtitle.textContent = "Sign up to start creating beautiful quotes.";
                submitBtn.innerHTML = `<span>Sign Up</span><span class="material-symbols-outlined text-[20px]">arrow_forward</span>`;
                toggleBtn.textContent = "Sign In";
                toggleBtn.previousSibling.textContent = "Already have an account? ";
            } else {
                title.textContent = "Welcome Back";
                subtitle.textContent = "Please sign in to access your quotations.";
                submitBtn.innerHTML = `<span>Sign In</span><span class="material-symbols-outlined text-[20px]">arrow_forward</span>`;
                toggleBtn.textContent = "Sign Up";
                toggleBtn.previousSibling.textContent = "Don't have an account? ";
            }
            errorMsg.classList.add('hidden');
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            errorMsg.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.7';

            try {
                if (isSignUp) {
                    await createUserWithEmailAndPassword(auth, email, password);
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
                // Redirect will be handled automatically by auth.js onAuthStateChanged
            } catch (error) {
                errorMsg.textContent = error.message.replace('Firebase: ', '');
                errorMsg.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.style.opacity = '1';
            }
        });
    </script>
</body>
</html>
